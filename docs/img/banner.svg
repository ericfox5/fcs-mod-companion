<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="FCS Online Dynasty">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b2e1b"/>
      <stop offset="1" stop-color="#145a33"/>
    </linearGradient>
    <pattern id="turf" width="120" height="260" patternUnits="userSpaceOnUse">
      <rect width="120" height="260" fill="none"/>
      <line x1="60" y1="0" x2="60" y2="260" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
      <line x1="60" y1="20" x2="60" y2="260" stroke="#ffffff" stroke-opacity="0.06" stroke-width="40"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" fill="url(#g)"/>
  <rect width="1200" height="260" fill="url(#turf)"/>
  <rect x="0" y="236" width="1200" height="24" fill="#0a0a0a"/>
  <!-- hash marks -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
    <line x1="0" y1="96" x2="1200" y2="96" stroke-dasharray="6 24"/>
    <line x1="0" y1="178" x2="1200" y2="178" stroke-dasharray="6 24"/>
  </g>
  <!-- wordmark -->
  <text x="72" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="1">FCS Online Dynasty</text>
  <text x="74" y="176" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#d7f0df">NCAA Football 14 online dynasties, revived for the FCS mod</text>
  <!-- ball -->
  <g transform="translate(1040 112) rotate(-28)">
    <ellipse cx="0" cy="0" rx="92" ry="54" fill="#7a3b12" stroke="#f2e6d6" stroke-width="4"/>
    <line x1="-34" y1="0" x2="34" y2="0" stroke="#f2e6d6" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#f2e6d6" stroke-width="5" stroke-linecap="round">
      <line x1="-22" y1="-9" x2="-22" y2="9"/><line x1="-7" y1="-9" x2="-7" y2="9"/><line x1="8" y1="-9" x2="8" y2="9"/><line x1="23" y1="-9" x2="23" y2="9"/>
    </g>
  </g>
  <text x="72" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9fb3a7">Fan project. Not affiliated with EA SPORTS or the NCAA. You must own NCAA Football 14.</text>
</svg>
