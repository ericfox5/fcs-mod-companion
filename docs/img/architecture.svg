<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="How the pieces connect">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#1f2937;stroke-width:1.5;rx:10}
      .t{font-size:16px;font-weight:700;fill:#111827}
      .s{font-size:12.5px;fill:#374151}
      .l{font-size:12px;fill:#4b5563}
      .edge{stroke:#4b5563;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .edge2{stroke:#4b5563;stroke-width:1.8;fill:none;marker-end:url(#a);marker-start:url(#a)}
    </style>
  </defs>
  <rect width="960" height="330" fill="#f6f7f9"/>

  <!-- consoles -->
  <rect x="24" y="60" width="200" height="150" class="box"/>
  <text x="124" y="90" text-anchor="middle" class="t">Consoles</text>
  <text x="124" y="114" text-anchor="middle" class="s">RPCS3 on each member's PC</text>
  <text x="124" y="132" text-anchor="middle" class="s">or a real PS3 (baked EBOOT)</text>
  <text x="124" y="160" text-anchor="middle" class="s">FCS mod + game patches</text>
  <text x="124" y="178" text-anchor="middle" class="s">set up by FCS-online.exe</text>

  <!-- league server -->
  <rect x="300" y="36" width="300" height="198" class="box"/>
  <text x="450" y="66" text-anchor="middle" class="t">League server (host's PC)</text>
  <text x="450" y="92" text-anchor="middle" class="s">spike/blaze/server (Node)</text>
  <text x="450" y="112" text-anchor="middle" class="s">redirector · login · Locker · DynastyOnDemand</text>
  <text x="450" y="130" text-anchor="middle" class="s">+ private PSN server (RPCN)</text>
  <line x1="320" y1="146" x2="580" y2="146" stroke="#d1d5db"/>
  <text x="450" y="170" text-anchor="middle" class="t" font-size="14">Bridge</text>
  <text x="450" y="190" text-anchor="middle" class="s">ncaa-bridge od watch: decodes every upload,</text>
  <text x="450" y="208" text-anchor="middle" class="s">mirrors it to the site, writes site edits back</text>

  <!-- site -->
  <rect x="676" y="60" width="260" height="150" class="box"/>
  <text x="806" y="90" text-anchor="middle" class="t">Companion site</text>
  <text x="806" y="114" text-anchor="middle" class="s">Cloudflare Worker + D1 + R2</text>
  <text x="806" y="140" text-anchor="middle" class="s">hub · rosters · stats · Wire · recruiting</text>
  <text x="806" y="158" text-anchor="middle" class="s">Supersim · FCS playoff · member accounts</text>
  <text x="806" y="186" text-anchor="middle" class="s">members' browsers, phones</text>

  <!-- edges -->
  <path d="M224 135 L300 135" class="edge2"/>
  <text x="262" y="126" text-anchor="middle" class="l">Blaze</text>
  <path d="M600 135 L676 135" class="edge2"/>
  <text x="638" y="126" text-anchor="middle" class="l">HTTPS</text>

  <!-- footer notes -->
  <text x="124" y="262" text-anchor="middle" class="l">uploads a dynasty file at every advance</text>
  <text x="450" y="262" text-anchor="middle" class="l">answers the console the way EA's service did</text>
  <text x="806" y="262" text-anchor="middle" class="l">edits flow back as a copy of the dynasty file</text>
  <text x="480" y="306" text-anchor="middle" class="l" font-size="12">One PC hosts the league. Everyone else only needs RPCS3, the FCS mod and FCS-online.exe.</text>
</svg>
